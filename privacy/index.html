<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--csp-->
    <title>Privacy | Jangal (જંગલ)</title>
    <meta name="description" content="Jangal keeps your family tree in your own browser. No account, no tracking, and nothing is uploaded unless you export it yourself." />
    <link rel="canonical" href="%VITE_SITE_URL%/privacy/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#EFF7F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#24211C" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jangal (જંગલ)" />
    <meta property="og:title" content="Privacy | Jangal (જંગલ)" />
    <meta property="og:description" content="Your family tree stays in your own browser. No account, no tracking, nothing uploaded." />
    <meta property="og:url" content="%VITE_SITE_URL%/privacy/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og/%VITE_OG_IMAGE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/site/site.css" />
    <!-- Light by default, or the theme picked in the app or here. Also runs the theme button. -->
    <script>
      ;(function () {
        var root = document.documentElement
        var t = 'light'
        try {
          if (localStorage.getItem('jangal:theme') === 'dark') t = 'dark'
        } catch (e) {}
        function show() {
          root.setAttribute('data-theme', t)
          var b = document.querySelector('.theme-toggle')
          if (b) b.setAttribute('aria-pressed', String(t === 'dark'))
        }
        show()
        document.addEventListener('DOMContentLoaded', show)
        document.addEventListener('click', function (e) {
          if (!e.target.closest || !e.target.closest('.theme-toggle')) return
          t = t === 'dark' ? 'light' : 'dark'
          show()
          try {
            localStorage.setItem('jangal:theme', t)
          } catch (e) {}
        })
      })()
    </script>
  </head>
  <body>
    <!--site:privacy-->
  </body>
</html>
