  // Neutral view: describe people by their line instead of by how they're related to you
  const lineOf = id => { const { side, blood } = Vadi.sideInfo(id); return !side ? 'Family' : blood ? Vadi.sideNames()[side] : 'Married in'; };
  const placeShort = p => (p.birth && p.birth.place ? p.birth.place.split(',')[0] : '');

  const BRAND = { word: 'Jangal', script: 'જંગલ', sub: 'The Family Forest',
    about: "Jangal (જંગલ) is Gujarati and Hindi for forest. It's the old joke about Indian families: we don't have a family tree, we have a family forest. This is a place to map yours, see how everyone in it is connected, and share it with them." };

  // Default portrait: a leaf in the person's branch colour
  const LEAF = '<svg class="leafpic" viewBox="0 0 64 64" aria-hidden="true"><rect class="lp-bg" width="64" height="64"/><g transform="rotate(38 32 34)"><path class="lp-stem" d="M32 47V57"/><path class="lp-leaf" d="M32 11C41.8 18.2 45.8 27.6 44.3 36.8C42.9 45 37.6 50 32 50C26.4 50 21.1 45 19.7 36.8C18.2 27.6 22.2 18.2 32 11Z"/><path class="lp-vein" d="M32 46V19M32 40.5L37.6 35M32 40.5L26.4 35M32 32L36.4 27.6M32 32L27.6 27.6"/></g></svg>';
  const MEM = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#mem-mark"/></svg>';
  const memTitle = p => `In memory, ${Vadi.years(p)}`;
  const av = (p, sz, tagName = 'span', extra = '') => {
    const s = Vadi.photo(p);
    return `<${tagName} class="av ${sideCls(p.id)}" style="--sz:${sz}px" ${extra}><span class="pic">${s ? `<img src="${s}" alt="">` : LEAF}</span>${p.death ? `<span class="mem" title="${esc(memTitle(p))}">${MEM}</span>` : ''}</${tagName}>`;
  };

  // ---------------------------------------------------------------- the tree's title
  // Suggested from the family names until you change it. Shown in the pill, the browser tab, the
  // Share sheet's cover, the printed poster, and export file names.
  let editingTitle = false;
  function renderTitle() {
    const t = Vadi.treeTitle(), sub = Vadi.state.subtitle, st = Vadi.state.showStats ? Vadi.treeStats() : '';
    document.title = `${t} · ${BRAND.word}`;
    $('#printHead').innerHTML = `<b>${esc(t)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}${st ? `<small>${esc(st)}</small>` : ''}`;
    if (!editingTitle) {
      $('#titleBlock').innerHTML = `<button class="ttl" id="ttlBtn" title="Rename the tree" aria-label="${esc(t)}. Rename the tree"><span class="ttl-text">${esc(t)}</span><i class="ph-bold ph-pencil-simple"></i></button>${sub ? `<div class="ttl-sub" title="${esc(sub)}">${esc(sub)}</div>` : ''}${st ? `<div class="ttl-stats">${esc(st)}</div>` : ''}`;
    }
    updateTopSafe();
  }
  function editTitle() {
    closePop(); closeSheet();
    editingTitle = true;
    const auto = Vadi.state.title == null, sug = Vadi.suggestedTitle();
    $('.brand').classList.add('editing');
    $('#titleBlock').innerHTML = `<form class="ttl-form" id="ttlForm">
      <input class="ttl-in" id="ttlIn" value="${esc(Vadi.treeTitle())}" placeholder="${esc(sug)}" maxlength="60" aria-label="Tree title" autocomplete="off">
      <input class="sub-in" id="subIn" value="${esc(Vadi.state.subtitle)}" placeholder="Add a subtitle or motto (optional)" maxlength="80" aria-label="Subtitle or motto" autocomplete="off">
      <label class="check"><input type="checkbox" id="statsIn" ${Vadi.state.showStats ? 'checked' : ''}>Show "${esc(Vadi.treeStats())}"</label>
      <div class="ttl-foot">${auto ? '<span class="auto">Suggested from the family names. It updates as the tree grows until you change it.</span>' : `<button type="button" class="mini" id="useSug">Use "${esc(sug)}"</button>`}
        <span class="acts"><button class="chunky go"><i class="ph-bold ph-check"></i>Save</button><button type="button" class="chunky" id="ttlCancel">Cancel</button></span></div>
    </form>`;
    const i = $('#ttlIn'); i.focus(); i.select();
    updateTopSafe();
  }
  function endTitleEdit() { editingTitle = false; $('.brand').classList.remove('editing'); renderTitle(); }
  document.addEventListener('submit', e => {
    if (e.target.id !== 'ttlForm') return;
    e.preventDefault();
    const typed = $('#ttlIn').value.trim(), sub = $('#subIn').value.trim(), showStats = $('#statsIn').checked;
    // an empty title, or the suggestion itself, goes back to automatic
    const title = !typed || typed === Vadi.suggestedTitle() ? null : typed;
    const renamed = title !== Vadi.state.title, changed = renamed || sub !== Vadi.state.subtitle || showStats !== Vadi.state.showStats;
    endTitleEdit();
    if (!changed) return;
    Vadi.setTreeInfo({ title, subtitle: sub, showStats });
    toast(`${renamed ? `Renamed to ${esc(Vadi.treeTitle())}` : 'Title saved'} <button id="toastUndo">Undo</button>`);
  });
  // Timeline and Fan chart cards start below the pill, whatever its height
  // (on phones the tabs sit under the pill, so they move with its height too)
  function updateTopSafe() {
    const root = document.documentElement.style, b = $('.brand').getBoundingClientRect();
    if (innerWidth < 760) { if (!editingTitle) root.setProperty('--tabs-top', Math.round(b.bottom + 8) + 'px'); }
    else root.removeProperty('--tabs-top');
    const tb = $('.tabs').getBoundingClientRect();
    root.setProperty('--top-safe', Math.round((innerWidth < 760 ? tb.bottom : Math.max(b.bottom, tb.bottom)) + 12) + 'px');
  }
  // Fit the tree, leaving room for the pill only if a tile would end up under it
  function fitPad() {
    const base = { l: 40, r: 40, t: 110, b: 110 }, saved = { ...vp.t };
    vp.fit(L.bounds, base, 1);
    const br = $('.brand').getBoundingClientRect(), { x, y, k } = vp.t;
    const under = Object.values(L.nodes).some(n => n.x * k + x < br.right + 8 && (n.x + n.w) * k + x > br.left && n.y * k + y < br.bottom + 8);
    vp.set(saved);
    return under ? { ...base, t: br.bottom + 16 } : base;
  }

  // ---------------------------------------------------------------- legend
  function renderLegend() {
    const n = Vadi.sideNames(), on = !document.body.classList.contains('plain');
    $('#legend').innerHTML = `<span class="lg s-pat"><i></i>${esc(n.paternal)}</span><span class="lg s-mat"><i></i>${esc(n.maternal)}</span><span class="lg s-own"><i></i>${esc(n.own)}</span>
      <button class="switch" id="sideSwitch" role="switch" aria-checked="${on}" title="Branch colors"><span class="knob"></span>Colors</button>`;
  }

  // ---------------------------------------------------------------- tree
  function tileHTML(p) {
    const sprouts = [['parent', 'Parent'], ['sibling', 'Sibling'], ['partner', 'Partner'], ['child', 'Child']]
      .map(([t, l]) => `<button class="sprout" data-add="${t}" data-nopan aria-label="Add ${t}"><i class="ph-bold ph-plus"></i>${l}</button>`).join('');
    if (naming === p.id) {
      return `${av(p, 66, 'label', `title="Add a photo" data-nopan`).replace('</label>', `<span class="cam"><i class="ph-bold ph-camera"></i></span><input type="file" accept="image/*" hidden data-photo-for="${p.id}"></label>`)}
        <input class="nm-in" data-name-for="${p.id}" placeholder="Their name" aria-label="Name" autocomplete="off"><div class="hint">Enter to save, Esc to undo</div>`;
    }
    // Neutral view: the tag shows years and the small line shows where they were born
    const tag = home() ? relOf(p.id) : Vadi.years(p), sub = home() ? Vadi.years(p) : placeShort(p);
    return `${av(p, 66)}<div class="nm">${esc(Vadi.fullName(p))}</div><div class="tag">${esc(tag)}</div><div class="yr">${esc(sub)}</div>${sprouts}`;
  }
  function render() {
    L = Vadi.layout(O);
    const seen = new Set();
    Object.values(L.nodes).forEach(n => {
      const p = Vadi.person(n.id);
      let el = tilesEl.querySelector(`.tile[data-id="${n.id}"]`);
      const isNew = !el;
      if (!el) { el = document.createElement('div'); el.dataset.id = n.id; el.dataset.nopan = ''; el.tabIndex = 0; el.setAttribute('role', 'button'); tilesEl.appendChild(el); }
      seen.add(el);
      const oldIn = el.querySelector('.nm-in'), keep = oldIn ? oldIn.value : '', hadFocus = oldIn && document.activeElement === oldIn;
      el.className = `tile ${sideCls(n.id)}`;
      el.innerHTML = tileHTML(p);
      const newIn = el.querySelector('.nm-in');
      if (newIn) { newIn.value = keep; if (hadFocus) newIn.focus(); }
      el.classList.toggle('home', n.id === home());
      el.classList.toggle('dead', !Vadi.isLiving(p));
      el.setAttribute('aria-label', `${Vadi.fullName(p)}, ${relOf(n.id) || lineOf(n.id)}, ${Vadi.years(p)}${p.death ? ', in memory' : ''}`);
      el.style.transform = `translate(${n.x}px, ${n.y}px)`;
      if (isNew && !first && !Vadi.reduceMotion()) el.animate([{ opacity: 0, scale: .3, rotate: '-10deg' }, { opacity: 1, scale: 1.08, rotate: '3deg', offset: .65 }, { opacity: 1, scale: 1, rotate: '0deg' }], { duration: 620, easing: 'cubic-bezier(.3,1.2,.5,1)' });
    });
    [...tilesEl.querySelectorAll('.tile')].forEach(el => { if (!seen.has(el)) el.remove(); });
    tilesEl.querySelectorAll('.fold, .pill').forEach(el => el.remove());
    let svg = '';
    L.families.forEach(f => {
      f.halves.forEach(h => { if (h.d) svg += `<path class="edge ${sideCls(h.pid)} ${f.status === 'divorced' ? 'ex' : ''}" data-key="${h.key}" d="${h.d}"/>`; });
      f.childSegs.forEach(c => { svg += `<path class="edge ${sideCls(c.cid)} ${c.kind !== 'bio' ? 'dashed' : ''}" data-key="${c.key}" d="${c.d}"/>`; });
      if (f.twoPartners) svg += `<circle class="knot" data-fam="${f.id}" cx="${f.anchor.x}" cy="${f.anchor.y}" r="6"/>`;
      if (f.canCollapse && !f.collapsed && f.childSegs.length) {
        const b = document.createElement('button');
        b.className = 'fold'; b.dataset.nopan = ''; b.dataset.fold = f.id; b.title = 'Tuck this branch away'; b.setAttribute('aria-label', 'Tuck this branch away');
        b.innerHTML = '<i class="ph-bold ph-minus"></i>'; b.style.left = f.bus.x + 'px'; b.style.top = f.bus.y + 'px';
        tilesEl.appendChild(b);
      }
    });
    edgesEl.setAttribute('width', L.bounds.w + 400); edgesEl.setAttribute('height', L.bounds.h + 400);
    edgesEl.innerHTML = svg + '<g id="vines"></g>';
    L.pills.forEach(pl => {
      const b = document.createElement('button');
      b.className = 'pill ' + pl.kind; b.dataset.nopan = ''; b.dataset.pill = pl.kind + ':' + pl.id;
      b.innerHTML = `${pl.hidden.slice(0, 3).map(id => av(Vadi.person(id), 26)).join('')}${pl.hidden.length} tucked away`;
      b.style.left = pl.at.x + 'px'; b.style.top = pl.at.y + 'px';
      tilesEl.appendChild(b);
    });
    $('#undo').disabled = !Vadi.canUndo(); $('#redo').disabled = !Vadi.canRedo();
    emphasis(); drawPath(false);
    first = false;
  }
  function emphasis() {
    world.classList.remove('focus'); $('#tlCard').classList.remove('focus');
    document.querySelectorAll('.lit').forEach(e => e.classList.remove('lit'));
    if (!hover || pathState && tab === 'tree') return;
    const im = Vadi.immediate(hover);
    if (tab === 'tree' && L.nodes[hover]) {
      world.classList.add('focus');
      im.persons.forEach(id => { const e = tilesEl.querySelector(`.tile[data-id="${id}"]`); e && e.classList.add('lit'); });
      im.edges.forEach(k => { const e = edgesEl.querySelector(`[data-key="${k}"]`); e && e.classList.add('lit'); });
      Vadi.familiesOf(hover).concat(Vadi.birthFamilyOf(hover) || []).forEach(fid => { const k = edgesEl.querySelector(`.knot[data-fam="${fid}"]`); k && k.classList.add('lit'); });
    }

  function drawPath(animate = true) {

      const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      el.setAttribute('d', src.getAttribute('d')); el.setAttribute('class', 'vine');

      if (animate && !Vadi.reduceMotion()) el.animate([{ strokeDashoffset: fwd ? len : -len }, { strokeDashoffset: 0 }], { duration: 260, delay: j * 115 + 80, fill: 'both', easing: 'cubic-bezier(.4,0,.2,1)' });
    });
  }
  function flyPath() {
    if (!pathState || tab !== 'tree') return;
    const sh = sheet.hidden ? 110 : Math.min(sheet.getBoundingClientRect().height + 110, innerHeight * .6);
    vp.flyTo(Vadi.boundsOf(pathState.res.persons, L), { l: 60, r: 60, t: 100, b: sh }, 1);
  }
  function setPath(a, b) {

    const res = Vadi.path(a, b);

    res.persons.forEach(id => { if (Vadi.reveal(id)) changed = true; });
    if (changed) render();
    pathState = { a, b, res };
    drawPath(true); flyPath();
  }

  // ---------------------------------------------------------------- timeline
  function renderTimeline() {
    const scroller = $('#tlScroll'), inner = $('#tlInner');
    if (!scroller.clientWidth) return;
    const gen = Vadi.generations(), h = home(), homeGen = h ? gen[h] : null;
    const births = Vadi.people.map(p => p.birth.y).filter(Boolean);
    const Y0 = Math.floor((Math.min(...births) - 3) / 10) * 10, Y1 = NOW + 4;
    const NAME = innerWidth < 760 ? 132 : 230, W = scroller.clientWidth - 16;
    const px = (W - NAME - 64) / (Y1 - Y0), x = y => NAME + (y - Y0) * px;
    const order = { paternal: 0, own: 1, maternal: 2 };
    const rows = Vadi.people.slice().sort((a, b) => gen[a.id] - gen[b.id] || (order[Vadi.side(a.id)] ?? 3) - (order[Vadi.side(b.id)] ?? 3) || a.birth.y - b.birth.y);
    const counts = {};
    rows.forEach(p => { counts[gen[p.id]] = (counts[gen[p.id]] || 0) + 1; });
    let html = `<div class="tl-axis" id="tlAxis">`;
    for (let y = Math.ceil(Y0 / 10) * 10; y <= Y1; y += 10) html += `<span class="tick" style="left:${x(y)}px">${y}</span>`;
    const Y = year == null ? NOW : year;
    html += `<button class="tl-knob" id="tlKnob" style="left:${x(Y + (year == null ? Vadi.today().getMonth() / 12 : .5))}px" role="slider" aria-label="Year" aria-valuemin="${Y0}" aria-valuemax="${NOW}" aria-valuenow="${Y}">${year == null ? 'Today' : Y}</button></div>`;
    for (let y = Math.ceil(Y0 / 10) * 10; y <= Y1; y += 10) html += `<div class="gridline" style="left:${x(y)}px"></div>`;
    let last = null, alive = 0, unborn = 0, gone = 0;
    rows.forEach(p => {
      const g = gen[p.id];
      if (g !== last) {
        const d = h ? homeGen - g : null, label = h ? (d === 0 ? 'Your generation' : Vadi.genName(d)) : g === 0 ? 'Oldest generation' : `Generation ${g + 1}`;
        html += `<div class="tl-group">${esc(label)}<span>${counts[g]} ${counts[g] === 1 ? 'person' : 'people'}</span></div>`; last = g;
      }
      const b = p.birth.y + ((p.birth.m || 6) - 1) / 12;
      const e = p.death ? (p.death.y ? p.death.y + ((p.death.m || 6) - 1) / 12 : b + 1) : NOW + Vadi.today().getMonth() / 12 + .3;
      const isUnborn = year != null && p.birth.y > year, isGone = year != null && p.death && p.death.y < year;
      if (year != null) { if (isUnborn) unborn++; else if (isGone) gone++; else alive++; }
      const endLbl = p.death ? `${MEM}${Vadi.age(p) == null ? 'dates unknown' : Vadi.age(p) + ' years'}` : `${Vadi.age(p)}`;
      const chip = year != null && !isUnborn && !isGone ? `<span class="agechip" style="left:${x(year + .5)}px">${year - p.birth.y}</span>` : '';
      html += `<div class="tl-row ${sideCls(p.id)} ${isUnborn ? 'unborn' : ''} ${isGone ? 'gone' : ''}" data-id="${p.id}" title="${esc(Vadi.fullName(p))}, ${esc(Vadi.years(p))}">
        <span class="tl-name" style="width:${NAME}px">${av(p, 30)}${esc(Vadi.fullName(p))}</span>
        <span class="tl-bar ${p.death ? '' : 'living'}" style="left:${x(b)}px;width:${Math.max(6, x(e) - x(b))}px"></span>
        <span class="tl-end" style="left:${x(e) + 8}px">${endLbl}</span>${chip}</div>`;
    });
    html += `<div class="tl-cursor" style="left:${x(Y + (year == null ? Vadi.today().getMonth() / 12 : .5))}px"></div>`;
    const top = scroller.scrollTop;
    inner.innerHTML = html;
    scroller.scrollTop = top;
    const me = h && Vadi.person(h);
    $('#tlRead').innerHTML = year == null
      ? 'Drag the year marker, or press play to watch the family grow'
      : `<b>${year}</b>${alive} living, ${gone} remembered, ${unborn} not born yet.${me ? (year < me.birth.y ? ` ${me.birth.y - year} years before you were born.` : ` You were ${year - me.birth.y}.`) : ''}`;
    renderTimeline.x = x; renderTimeline.Y0 = Y0;
    emphasis();

    if (/input|textarea/i.test(document.activeElement.tagName)) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' || e.key === '/') { e.preventDefault(); if (openSheet !== 'find') toggleSheet('find'); return; }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? Vadi.redo() : Vadi.undo(); return; }
    if (e.key === '1') setTab('tree'); if (e.key === '2') setTab('timeline'); if (e.key === '3') setTab('fan');
    if (e.key.toLowerCase() === 'f' && !e.metaKey && tab === 'tree') $('#fit').click();
    if (e.key === 'Enter' && document.activeElement.id === 'fanCenter') openPop(focus, 'view', document.activeElement.getBoundingClientRect());
  });
  window.addEventListener('resize', () => { updateTopSafe(); if (tab === 'timeline') renderTimeline(); placePop(); });
  Vadi.on(() => {
    render(); renderLegend(); renderMe(); renderTitle();
    if (pathState) { try { pathState.res = Vadi.path(pathState.a, pathState.b); drawPath(false); } catch (err) { pathState = null; } }
    if (openSheet) renderSheet(false);
    if (tab === 'timeline') renderTimeline();
    if (tab === 'fan') { if (!Vadi.person(focus)) focus = home() || Vadi.anchorId(); buildFan(); renderCrumbs(); }
  });

  // URL options for quick looks: ?view=timeline|fan  ?me=nico or ?me=none  ?theme=dark
  setTheme(qs.get('theme') === 'dark' ? 'dark' : 'light');
  Vadi.state.subtitle = 'From Sevilla and Chennai to Texas'; // sample motto
  renderLegend(); renderMe(); renderTitle();
  render();
  setGens(innerWidth < 600 ? 3 : 4);
  const start = qs.get('view');
  if (start && ['timeline', 'fan'].includes(start)) setTab(start);
  const h0 = home();
  if (innerWidth < 760 && h0) vp.fit(Vadi.boundsOf([h0, ...Vadi.parentsOf(h0), ...Vadi.partnersOf(h0)], L), { l: 12, r: 12, t: $('.tabs').getBoundingClientRect().bottom + 12, b: 110 }, .7);
  else vp.fit(L.bounds, fitPad(), 1);
  document.fonts && document.fonts.ready.then(updateTopSafe);
})();
</script>
