<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jangal (જંગલ) - The Family Forest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,700&family=Rasa:ital,wght@1,700&family=Noto+Sans+Gujarati:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root {
  --bg: #EFF7F1; --tile: #FDFFFD; --card: #FDFFFD; --ink: #0B3320; --ink-2: #3E6550; --ink-3: #6F8F7A;
  --leaf: #1B9A56; --leaf-deep: #117242; --on-leaf: #F4FFF8; --mint: #D2F1DD; --mint-2: #E4F6EA;
  --line: #BFDDC9; --ledge: #CBE6D4; --ledge-leaf: #0E5C35; --soft: 0 14px 30px rgba(17, 90, 50, .10);
  /* branch shades: pine for the father's side, moss for the mother's side, leaf for your own family */
  --pat: #1E6A50; --pat-ink: #185640; --mat: #6A962C; --mat-ink: #4B6D1C; --own: #1B9A56; --own-ink: #117242; --on-side: #F5FFF8;
  --bark: #8A6443; /* the seed in the remembrance mark */
  --field: #BFDDC9; /* borders of inputs and off switches */
  --display: 'Bricolage Grotesque', 'Noto Sans Gujarati', ui-sans-serif, system-ui, sans-serif; --ui: 'Figtree', 'Noto Sans Gujarati', ui-sans-serif, system-ui, sans-serif;
  /* wordmark only. Fraunces has no Gujarati, so Rasa (a Gujarati face with true italics) draws જંગલ */
  --wordmark: 'Fraunces', 'Rasa', ui-serif, Georgia, serif;
  color-scheme: light;
}
/* Dark: "Bark". Your first palette (#312E28, #353A31, #2E4B36, #4F473B, #5F725D) with the ground taken
   a step darker and the leaf tiles a step lighter (#34533D), so tiles and panels stand off it. Parchment text (#D3C5B5) from the second
   palette, and brighter greens only where something needs to be seen or pressed. */
:root[data-theme="dark"] {
  --bg: #24211C; --tile: #3A3F35; --card: #34533D; --ink: #EFE6DA; --ink-2: #D3C5B5; --ink-3: #BFB3A3;
  --leaf: #A3C585; --leaf-deep: #BEDBA3; --on-leaf: #0B1F14; --mint: #4F473B; --mint-2: #454A3F;
  --line: #5F725D; --ledge: #15130F; --ledge-leaf: #5E7F48; --soft: 0 14px 30px rgba(0, 0, 0, .45);
  --pat: #8DBDAB; --pat-ink: #AAD3C4; --mat: #C3C27C; --mat-ink: #D8D79A; --own: #A3C585; --own-ink: #BEDBA3; --on-side: #0B1F14;
  --bark: #D0A57E; --field: #7C8B78;
  color-scheme: dark;
}
/* the lighter leaf tiles need slightly brighter small text to stay above 4.5:1 */
:root[data-theme="dark"] .tile { --ink-3: #CCC1B1; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }

.s-own { --side: var(--own); --side-ink: var(--own-ink); }
.s-pat { --side: var(--pat); --side-ink: var(--pat-ink); }
.s-mat { --side: var(--mat); --side-ink: var(--mat-ink); }
.s-none { --side: var(--ink-3); --side-ink: var(--ink-2); }
body.plain .s-pat, body.plain .s-mat, body.plain .s-none { --side: var(--own); --side-ink: var(--own-ink); }

/* ---------- avatar: photo or leaf, plus the remembrance mark (a sprouting seed by default) ---------- */
.av { position: relative; display: inline-block; flex: none; width: var(--sz); height: var(--sz); }
.av .pic { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: color-mix(in srgb, var(--side) 15%, var(--tile)); }
.av .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.leafpic { width: 100%; height: 100%; display: block; }
.lp-bg { fill: color-mix(in srgb, var(--side) 15%, var(--tile)); }
.lp-leaf { fill: var(--side); }
.lp-stem { stroke: var(--side); stroke-width: 2.8; stroke-linecap: round; fill: none; }
.lp-vein { stroke: color-mix(in srgb, var(--side) 15%, var(--tile)); stroke-width: 2; stroke-linecap: round; fill: none; }
.mem { position: absolute; right: -3px; bottom: -3px; width: max(16px, calc(var(--sz) * .36)); height: max(16px, calc(var(--sz) * .36)); border-radius: 50%; background: var(--tile); box-shadow: 0 0 0 2px var(--tile); display: grid; place-items: center; color: color-mix(in srgb, var(--side-ink) 80%, var(--ink-3)); }
.mem svg { width: 68%; height: 68%; display: block; }

/* ---------- chrome ---------- */
.brand { position: fixed; z-index: 12; top: 16px; left: 16px; display: grid; gap: 6px; padding: 10px 14px 10px 16px; background: var(--tile); border-radius: 22px; box-shadow: 0 4px 0 var(--ledge), var(--soft); }
.brand .row1 { display: flex; align-items: baseline; gap: 8px; }
.brand .wm { font-size: 20px; }
.brand .sub { font-size: 13px; }
.brand.editing { z-index: 30; }
.brand.editing .legend { display: none; }
/* the tree's own title: the main line of the pill */
.titleblock { display: grid; justify-items: start; gap: 1px; min-width: 0; padding-top: 7px; border-top: 2px solid var(--mint-2); }
.ttl { display: inline-flex; align-items: center; gap: 8px; max-width: min(420px, calc(100vw - 64px)); padding: 0 2px 0 0; border: 0; background: none; color: var(--ink); text-align: left; border-radius: 8px; }
.ttl-text { font: 800 22px/1.15 var(--display); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl i { flex: none; font-size: 15px; color: var(--ink-3); opacity: 0; transition: opacity .15s; }
.ttl:hover i, .ttl:focus-visible i { opacity: 1; }
@media (hover: none) { .ttl i { opacity: 1; } }
.ttl-sub { max-width: min(420px, calc(100vw - 64px)); font-weight: 600; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl-stats { font-weight: 600; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ttl-form { display: grid; gap: 6px; width: min(400px, calc(100vw - 64px)); }
.ttl-in, .sub-in { width: 100%; min-width: 0; border: 2px solid var(--field); border-radius: 12px; background: var(--tile); padding: 0 10px; }
.ttl-in { height: 40px; font: 800 19px var(--display); letter-spacing: -.01em; }
.sub-in { height: 34px; font-weight: 600; font-size: 13.5px; }
.ttl-in:focus, .sub-in:focus { outline: none; border-color: var(--leaf); }
.ttl-form .check { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin: 2px 0; }
.ttl-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ttl-foot .auto { flex: 1 1 170px; font-size: 12px; font-weight: 500; color: var(--ink-3); line-height: 1.35; }
.ttl-foot .acts { display: flex; gap: 6px; margin-left: auto; }
.ttl-foot .chunky { height: 34px; padding: 0 14px; font-size: 13.5px; }
/* Share sheet: what exports open with. The family's title leads, the app is a small credit. */
.cover { position: relative; margin: -2px 0 14px; padding: 18px 20px 14px; border-radius: 22px; background: var(--bg); display: grid; gap: 2px; }
.cover .eyebrow { font-size: 12px; font-weight: 700; color: var(--ink-3); margin-bottom: 4px; }
.cover b { font: 800 clamp(22px, 3.4vw, 28px)/1.1 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.cover .c-sub { font-weight: 600; color: var(--ink-2); }
.cover .c-stats { font-weight: 600; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cover .made { justify-self: end; margin-top: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.cover .made .wm { font-size: 15px; color: var(--ink-2); }
.cover .mini { position: absolute; top: 12px; right: 12px; }
/* printed poster: title block on top, a small credit at the bottom */
.printhead, .printfoot { display: none; }
.wmbtn { display: inline-flex; align-items: baseline; gap: 8px; padding: 0 4px 0 0; border: 0; background: none; border-radius: 12px; text-align: left; }
.wm { font: italic 700 28px/1.12 var(--wordmark); font-variation-settings: 'opsz' 72; letter-spacing: -.005em; color: var(--ink); white-space: nowrap; }
.sub { font: 500 15px var(--display); color: var(--ink-3); white-space: nowrap; }
.wmbtn:hover .sub { color: var(--ink-2); }
.legend { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.lg { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px 0 6px; border-radius: 99px; background: color-mix(in srgb, var(--side) 12%, var(--tile)); color: var(--side-ink); font-weight: 700; font-size: 12px; white-space: nowrap; }
.lg i { width: 10px; height: 10px; border-radius: 50%; background: var(--side); }
.switch { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; font-weight: 700; font-size: 12px; color: var(--ink-3); padding: 0 4px; height: 24px; }
.switch .knob { width: 28px; height: 16px; border-radius: 99px; background: var(--field); position: relative; transition: background .2s; }
.switch .knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--tile); transition: transform .2s cubic-bezier(.3, 1.4, .5, 1); }
.switch[aria-checked="true"] .knob { background: var(--leaf); }
.switch[aria-checked="true"] .knob::after { transform: translateX(12px); }
body.plain .lg { opacity: .45; }

.tabs { position: fixed; z-index: 12; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; background: var(--tile); border-radius: 99px; box-shadow: 0 4px 0 var(--ledge), var(--soft); }
.tabs button { height: 42px; display: inline-flex; align-items: center; gap: 8px; padding: 0 18px; border: 0; border-radius: 99px; background: none; font-weight: 700; color: var(--ink-2); transition: background .15s, color .15s, transform .12s; }
.tabs button i { font-size: 18px; }
.tabs button:hover { background: var(--mint-2); color: var(--ink); }
.tabs button:active { transform: scale(.96); }
.tabs button[aria-selected="true"] { background: var(--leaf); color: var(--on-leaf); }
.corner { position: fixed; z-index: 12; top: 16px; right: 16px; display: flex; gap: 8px; }
.pillset { display: flex; gap: 2px; background: var(--tile); border-radius: 99px; padding: 4px; box-shadow: 0 4px 0 var(--ledge), var(--soft); }
.round { width: 38px; height: 38px; border-radius: 99px; border: 0; background: none; display: grid; place-items: center; font-size: 17px; color: var(--ink-2); }
.round:hover:not(:disabled) { background: var(--mint-2); color: var(--ink); }
.round:disabled { opacity: .35; cursor: default; }

.dock { position: fixed; z-index: 20; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; background: var(--tile); border-radius: 99px; box-shadow: 0 5px 0 var(--ledge), var(--soft); }
.dock button { height: 46px; display: inline-flex; align-items: center; gap: 8px; padding: 0 18px; border: 0; border-radius: 99px; background: none; font-weight: 700; color: var(--ink-2); transition: background .15s, color .15s, transform .12s; }
.dock button i { font-size: 19px; }
.dock button:hover { background: var(--mint-2); color: var(--ink); }
.dock button:active { transform: scale(.96); }
.dock button[aria-pressed="true"] { background: var(--leaf); color: var(--on-leaf); }
.dock .sep { width: 1px; background: var(--line); margin: 8px 4px; }
.dock .me { padding-left: 8px; }
.dock .me .av .pic { box-shadow: 0 0 0 2px var(--tile), 0 0 0 4px color-mix(in srgb, var(--side) 62%, var(--tile)); }
.dock .me .mem { display: none; }
.dock .me[aria-pressed="true"] .av .pic { box-shadow: 0 0 0 2px var(--on-leaf); }
.view-enter { animation: viewin .32s cubic-bezier(.3, 1.2, .5, 1); }
@keyframes viewin { from { opacity: 0; transform: translateY(10px) scale(.99); } }

/* ---------- tree ---------- */
.canvas { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
.canvas.is-panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; transition: opacity .2s, stroke .2s; }
.edge.s-own, .edge.s-pat, .edge.s-mat { stroke: color-mix(in srgb, var(--side) 38%, var(--line)); }
body.plain .edge { stroke: var(--line); }
.edge.dashed { stroke-dasharray: 2 8; }
.edge.ex { stroke-dasharray: 1 7; }
.knot { fill: var(--tile); stroke: var(--line); stroke-width: 3; transition: opacity .2s, stroke .2s; }
.vine { fill: none; stroke: var(--leaf); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }

.tile { --tile: var(--card); position: absolute; left: 0; top: 0; width: 140px; height: 180px; padding: 14px 10px 10px; background: var(--tile); border-radius: 24px; text-align: center; cursor: pointer; user-select: none;
  box-shadow: 0 5px 0 var(--ledge), 0 10px 22px rgba(17, 90, 50, .07);
  transition: transform .55s cubic-bezier(.3, 1.3, .5, 1), opacity .2s, translate .18s cubic-bezier(.3, 1.4, .5, 1), box-shadow .18s, scale .2s; }
.tile:hover { translate: 0 -4px; box-shadow: 0 9px 0 var(--ledge), 0 16px 28px rgba(17, 90, 50, .12); z-index: 3; }
.tile:active { translate: 0 3px; box-shadow: 0 2px 0 var(--ledge), 0 6px 12px rgba(17, 90, 50, .08); }
.tile > .av { margin: 0 auto; }
.tile > .av .pic { box-shadow: 0 0 0 3px var(--tile), 0 0 0 6px color-mix(in srgb, var(--side) 62%, var(--tile)); }
.tile .nm { margin-top: 10px; font: 700 15.5px/1.12 var(--display); letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .tag:empty { display: none; }
.tile .tag { display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 99px; background: color-mix(in srgb, var(--side) 13%, var(--tile)); color: var(--side-ink); font-weight: 700; font-size: 11.5px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .yr { margin-top: 4px; font-size: 11.5px; color: var(--ink-3); font-weight: 600; font-variant-numeric: tabular-nums; }
.tile.dead { background: color-mix(in srgb, var(--tile) 82%, var(--mint-2)); }
.tile.dead > .av .pic img { filter: saturate(.55); }
.tile.home { background: var(--leaf); color: var(--on-leaf); box-shadow: 0 5px 0 var(--ledge-leaf), 0 10px 22px rgba(17, 90, 50, .18); }
.tile.home .tag { background: color-mix(in srgb, var(--on-leaf) 22%, transparent); color: var(--on-leaf); }
.tile.home .yr { color: color-mix(in srgb, var(--on-leaf) 75%, transparent); }
.tile.home > .av .pic { box-shadow: 0 0 0 3px var(--on-leaf); }
.tile input.nm-in { margin-top: 10px; width: 100%; height: 34px; border: 2px solid var(--leaf); border-radius: 12px; text-align: center; font: 700 14px var(--display); background: var(--tile); outline: none; }
.tile .hint { font-size: 11px; color: var(--ink-3); margin-top: 6px; font-weight: 600; }
.tile label.av { cursor: pointer; }
.tile label.av .cam { position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; border-radius: 50%; background: var(--leaf); color: var(--on-leaf); display: grid; place-items: center; font-size: 12px; box-shadow: 0 0 0 2px var(--tile); }

.sprout { position: absolute; height: 28px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px 0 7px; border-radius: 99px; border: 0; background: var(--leaf); color: var(--on-leaf); font-weight: 700; font-size: 12px; opacity: 0; scale: .5; pointer-events: none; transition: opacity .15s, scale .2s cubic-bezier(.3, 1.6, .5, 1); box-shadow: 0 3px 0 var(--ledge-leaf); white-space: nowrap; z-index: 4; }
.sprout i { font-size: 13px; }
.tile:hover .sprout { opacity: 1; scale: 1; pointer-events: auto; }
.sprout[data-add="parent"] { top: -16px; left: 50%; translate: -50% 0; }
.sprout[data-add="child"] { bottom: -18px; left: 50%; translate: -50% 0; }
.sprout[data-add="sibling"] { left: -22px; top: 44px; translate: -50% 0; }
.sprout[data-add="partner"] { right: -22px; top: 44px; translate: 50% 0; }
.tile.home .sprout { background: var(--ink); color: var(--bg); box-shadow: none; }
.fold { position: absolute; height: 24px; margin: -12px 0 0 -12px; min-width: 24px; border-radius: 99px; border: 0; background: var(--tile); color: var(--ink-3); box-shadow: 0 0 0 3px var(--line); display: grid; place-items: center; font-size: 12px; z-index: 2; transition: opacity .2s; }
.fold:hover { background: var(--leaf); color: var(--on-leaf); box-shadow: 0 0 0 3px var(--leaf); }
.pill { position: absolute; transform: translate(-50%, 0); display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 5px; border-radius: 99px; border: 0; background: var(--tile); font-weight: 700; color: var(--ink-2); box-shadow: 0 4px 0 var(--ledge); white-space: nowrap; z-index: 2; }
.pill.anc { transform: translate(-50%, -100%); }
.pill .av { margin-left: -8px; }
.pill .av:first-child { margin-left: 0; }
.pill .av .pic { box-shadow: 0 0 0 2px var(--tile); }
.world.focus .tile:not(.lit), .world.pathing .tile:not(.on-path) { opacity: .38; scale: .96; }
.world.focus .edge:not(.lit), .world.pathing .edge, .world.focus .knot:not(.lit), .world.pathing .knot { opacity: .3; }
.world.focus .edge.lit, .world.focus .knot.lit { stroke: var(--leaf); }
.world.focus .fold, .world.pathing .fold, .world.focus .pill, .world.pathing .pill { opacity: .3; }
.tile.on-path { animation: pop-in .5s both cubic-bezier(.3, 1.5, .5, 1); animation-delay: calc(var(--i) * 230ms); }
.tile.on-path:not(.home) { box-shadow: 0 0 0 4px var(--leaf), 0 5px 0 4px var(--ledge-leaf); }
@keyframes pop-in { 0% { opacity: .38; scale: .96; } 60% { scale: 1.06; } 100% { opacity: 1; scale: 1; } }
.ping::after { content: ''; position: absolute; inset: -6px; border-radius: 30px; border: 4px solid var(--leaf); animation: ping 1.1s ease-out 2; pointer-events: none; }
@keyframes ping { from { opacity: .9; scale: 1; } to { opacity: 0; scale: 1.25; } }

/* ---------- timeline ---------- */
.panelview { position: fixed; z-index: 5; top: var(--top-safe, 96px); bottom: 92px; left: 16px; right: 16px; }
.tl-card { height: 100%; display: grid; grid-template-rows: auto 1fr; background: var(--tile); border-radius: 28px; box-shadow: 0 6px 0 var(--ledge), var(--soft); overflow: hidden; }
.tl-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 18px 22px 12px; }
.tl-top h2 { margin: 0; font: 800 26px/1.1 var(--display); letter-spacing: -.02em; }
.tl-read { color: var(--ink-3); font-weight: 600; font-size: 14px; margin-top: 2px; }
.tl-read b { color: var(--leaf-deep); font: 800 18px var(--display); margin-right: 4px; }
.tl-scroll { overflow: auto; position: relative; }
.tl-inner { position: relative; padding-bottom: 20px; }
.tl-axis { position: sticky; top: 0; z-index: 4; height: 36px; background: var(--tile); cursor: ew-resize; box-shadow: 0 1px 0 var(--mint); }
.tick { position: absolute; top: 10px; transform: translateX(-50%); font-weight: 700; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.gridline { position: absolute; top: 36px; bottom: 0; width: 2px; margin-left: -1px; background: var(--mint-2); border-radius: 2px; }
.tl-group { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 8px; padding: 16px 22px 6px; font: 800 16px var(--display); }
.tl-group span { font: 600 12.5px var(--ui); color: var(--ink-3); }
.tl-row { position: relative; z-index: 1; height: 44px; display: flex; align-items: center; cursor: pointer; border-radius: 16px; margin: 0 8px; transition: opacity .25s, background .15s; }
.tl-row:hover, .tl-row.lit { background: var(--mint-2); }
.tl-name { display: flex; align-items: center; gap: 10px; padding-left: 12px; font: 700 14px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-bar { position: absolute; height: 18px; border-radius: 99px; background: var(--side); transition: opacity .25s; }
.tl-bar.living { -webkit-mask: linear-gradient(90deg, #000 88%, transparent); mask: linear-gradient(90deg, #000 88%, transparent); }
.tl-end { position: absolute; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 12.5px; color: var(--side-ink); white-space: nowrap; }
.tl-end svg { width: 14px; height: 14px; }
.agechip { position: absolute; z-index: 2; transform: translateX(-50%); height: 24px; min-width: 30px; padding: 0 7px; border-radius: 99px; background: var(--tile); color: var(--ink); font: 800 13px/24px var(--display); text-align: center; box-shadow: 0 0 0 2px var(--side), 0 3px 0 var(--ledge); }
.timeline.focus .tl-row:not(.lit) { opacity: .35; }
.tl-row.unborn { opacity: .22; }
.tl-row.gone { opacity: .5; }
.tl-cursor { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--leaf); border-radius: 3px; z-index: 3; pointer-events: none; }
.tl-knob { position: absolute; top: 5px; transform: translateX(-50%); z-index: 5; height: 26px; padding: 0 12px; border-radius: 99px; border: 0; background: var(--leaf); color: var(--on-leaf); font: 800 13px var(--display); cursor: ew-resize; box-shadow: 0 3px 0 var(--ledge-leaf); white-space: nowrap; }

/* ---------- fan chart ---------- */
.fan-wrap { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.fan-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.crumbs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; min-height: 40px; }
.crumbs button { border: 0; background: var(--tile); padding: 6px 12px; border-radius: 99px; font-weight: 700; color: var(--ink-2); box-shadow: 0 3px 0 var(--ledge); }
.crumbs button:hover { color: var(--ink); }
.crumbs i { color: var(--ink-3); }
.crumbs b { font: 800 16px var(--display); padding: 0 6px; }
.fan-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--tile); border-radius: 99px; padding: 4px; box-shadow: 0 3px 0 var(--ledge); }
.seg button { height: 34px; min-width: 36px; padding: 0 12px; border: 0; border-radius: 99px; background: none; font-weight: 700; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--leaf); color: var(--on-leaf); }
.seg .lbl { font-weight: 700; font-size: 13px; color: var(--ink-3); padding: 0 8px 0 10px; align-self: center; }
.fan-stage { position: relative; min-height: 0; }
.fan-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
#fanRings { transform-origin: 500px 500px; transition: opacity .22s, transform .42s cubic-bezier(.3, 1.3, .5, 1); }
#fanRings.out { opacity: 0; transform: scale(.9) rotate(-8deg); }
#fanRings.in { opacity: 0; transform: scale(1.06) rotate(8deg); transition: none; }
.fw { stroke: var(--bg); stroke-width: 5; stroke-linejoin: round; cursor: pointer; transition: opacity .2s; }
.fw.ghost { fill: transparent !important; stroke: var(--line); stroke-dasharray: 3 7; stroke-width: 2.5; stroke-linecap: round; }
.fw.ghost:hover { fill: var(--mint-2) !important; }
.flbl { pointer-events: none; font-family: var(--display); font-weight: 700; transition: opacity .2s; }
.flbl .yr { font-family: var(--ui); font-weight: 600; }
.flbl.on-side { fill: var(--on-side); }
.flbl.ink { fill: var(--ink); }
.fmem { pointer-events: none; transition: opacity .2s; }
.ghost-plus { fill: var(--ink-3); font: 800 18px var(--display); pointer-events: none; }
#fanSvg.hovering .fw:not(.on), #fanSvg.hovering .flbl:not(.on), #fanSvg.hovering .fmem:not(.on) { opacity: .25; }
.fan-center { cursor: pointer; }
.fan-name { font: 800 19px var(--display); fill: var(--ink); letter-spacing: -.01em; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 600; line-height: 1.35; white-space: nowrap; transform: translate(-50%, calc(-100% - 14px)); }
.tip b { display: block; font: 800 15px var(--display); }

/* ---------- sheets, popover, forms ---------- */
.sheet { position: fixed; z-index: 19; left: 50%; bottom: 90px; width: min(760px, calc(100vw - 24px)); transform: translateX(-50%); background: var(--tile); border-radius: 28px; box-shadow: 0 6px 0 var(--ledge), var(--soft); padding: 22px; animation: sheet .35s cubic-bezier(.3, 1.3, .5, 1); max-height: calc(100dvh - 190px); overflow: auto; }
@keyframes sheet { from { opacity: 0; transform: translate(-50%, 24px) scale(.97); } }
.sheet h2 { margin: 0 0 14px; font: 800 26px/1.1 var(--display); letter-spacing: -.02em; }
.sheet .x { position: absolute; top: 14px; right: 14px; }
.slots { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; }
.slot { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 22px; border: 2px dashed var(--line); background: var(--mint-2); text-align: left; min-height: 88px; }
.slot.filled { border-color: transparent; }
.slot.picking { border-color: var(--leaf); border-style: solid; background: var(--tile); }
.slot .q { width: 58px; height: 58px; border-radius: 50%; background: var(--mint); color: var(--leaf-deep); display: grid; place-items: center; font-size: 20px; }
.slot .who b { display: block; font: 700 18px var(--display); }
.slot .who span { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.swap { width: 44px; height: 44px; border-radius: 99px; border: 0; background: var(--mint); color: var(--leaf-deep); font-size: 18px; display: grid; place-items: center; }
.swap:hover { background: var(--leaf); color: var(--on-leaf); }
.picker { margin-top: 16px; }
.picker input, .find-in { width: 100%; height: 46px; border-radius: 99px; border: 2px solid var(--field); background: var(--tile); padding: 0 18px; font-weight: 600; }
.picker input:focus, .find-in:focus { outline: none; border-color: var(--leaf); }
.faces { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; margin-top: 12px; }
.face { border: 0; background: none; border-radius: 16px; padding: 8px 4px; display: grid; justify-items: center; gap: 5px; font-weight: 700; font-size: 12.5px; }
.face:hover { background: var(--mint-2); }
.answer { margin-top: 18px; padding: 18px 20px; border-radius: 22px; background: var(--leaf); color: var(--on-leaf); animation: sheet .4s cubic-bezier(.3, 1.3, .5, 1); }
.answer .big { font: 800 clamp(26px, 4vw, 38px)/1.05 var(--display); letter-spacing: -.02em; }
.answer .sen { margin-top: 4px; font-weight: 600; opacity: .9; }
.hops { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; }
.hop { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px 4px 4px; border-radius: 99px; background: color-mix(in srgb, var(--on-leaf) 16%, transparent); font-weight: 700; font-size: 13px; }
.hop small { font-weight: 600; opacity: .8; }
.results { margin-top: 12px; display: grid; gap: 4px; }
.res { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 8px 12px 8px 8px; border-radius: 18px; border: 0; background: none; text-align: left; }
.res:hover { background: var(--mint-2); }
.res b { font: 700 16px var(--display); display: block; }
.res span { color: var(--ink-3); font-weight: 600; font-size: 13px; }
.res em { font-style: normal; font-weight: 700; color: var(--side-ink); font-size: 13px; }
.bdays { display: grid; grid-auto-flow: column; grid-auto-columns: 168px; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.bday { scroll-snap-align: start; border: 0; border-radius: 22px; padding: 14px; background: var(--mint-2); text-align: left; display: grid; gap: 8px; }
.bday .when { font-weight: 700; color: var(--ink-3); font-size: 12.5px; }
.bday b { font: 700 16px/1.15 var(--display); }
.bday .age { font: 800 34px/1 var(--display); letter-spacing: -.03em; }
.bday.big { background: var(--leaf); color: var(--on-leaf); }
.bday.big .when { color: color-mix(in srgb, var(--on-leaf) 80%, transparent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.chunky { height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 18px; border: 0; border-radius: 99px; background: var(--mint); color: var(--leaf-deep); font-weight: 700; box-shadow: 0 3px 0 var(--ledge); white-space: nowrap; }
.chunky:hover { filter: brightness(1.03); }
.chunky:active { translate: 0 2px; box-shadow: 0 1px 0 var(--ledge); }
.chunky.go { background: var(--leaf); color: var(--on-leaf); box-shadow: 0 3px 0 var(--ledge-leaf); }
.exports { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.exp { border: 0; border-radius: 22px; padding: 16px; background: var(--mint-2); text-align: left; display: grid; gap: 6px; }
.exp:hover { background: var(--mint); }
.exp i { font-size: 26px; color: var(--leaf-deep); }
.exp b { font: 700 17px var(--display); }
.exp span { font-size: 13px; color: var(--ink-3); font-weight: 500; }

/* Person card. It sits beside whatever you clicked, flips sides and clamps to the free space between
   the top bar and the dock, and scrolls only its middle when space runs out, so the name and the Save
   button never leave the screen. Fields reflow with a container query. Phones get a bottom sheet. */
.pop { position: fixed; z-index: 25; --pw: 360px; width: min(var(--pw), calc(100vw - 24px)); display: flex; flex-direction: column; background: var(--tile); border-radius: 26px; box-shadow: 0 6px 0 var(--ledge), var(--soft); overflow: hidden; container: pop / inline-size; animation: popin .3s cubic-bezier(.3, 1.4, .5, 1); }
.pop.edit { --pw: 440px; }
@keyframes popin { from { opacity: 0; scale: .9; } }
.pop-in { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; margin: 0; }
.pop-head { flex: none; display: flex; align-items: flex-start; gap: 6px; padding: 16px 12px 12px 18px; }
.pop-head .top { flex: 1; min-width: 0; }
.pop-head .x { flex: none; }
.pop-body { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 2px 18px 16px; }
.pop-foot { flex: none; display: grid; gap: 12px; padding: 12px 18px 16px; border-top: 2px solid var(--mint-2); }
.pop-foot .row { margin: 0; }
.pop .top { display: flex; gap: 14px; align-items: center; }
.pop label.av { cursor: pointer; }
.pop h3 { margin: 0; font: 800 22px/1.05 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.pop .top .tag { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 99px; background: color-mix(in srgb, var(--side) 14%, var(--tile)); color: var(--side-ink); font-weight: 700; font-size: 12.5px; }
.pop .gline { font-size: 12.5px; color: var(--ink-3); font-weight: 600; margin-top: 4px; }
.pop .facts { display: grid; gap: 8px; }
.pop .fact { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; }
.pop .fact > i, .pop .fact > .ic { width: 32px; height: 32px; border-radius: 12px; background: var(--mint-2); display: grid; place-items: center; color: var(--leaf-deep); font-size: 16px; flex: none; }
.pop .fact > .ic svg { width: 20px; height: 20px; }
.pop .fact small { display: block; color: var(--ink-3); font-weight: 600; font-size: 12px; }
.pop p { margin: 12px 0 0; color: var(--ink-2); font-size: 14px; white-space: pre-line; }
.pop .empty { margin: 0; color: var(--ink-3); font-weight: 600; }
.pop .chunky { height: 38px; padding: 0 14px; font-size: 14px; }
.meline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--ink-3); }
.meline > i { font-size: 17px; }
.meline span { flex: 1; min-width: 120px; }
.mini { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 99px; border: 2px solid var(--field); background: none; font-weight: 700; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.mini:hover { border-color: var(--leaf); color: var(--ink); }
.pop .fields { display: grid; gap: 10px; }
.pop label, .fl { font-size: 12.5px; font-weight: 700; color: var(--ink-2); display: grid; gap: 4px; }
.pop .fields input:not([type=radio]):not([type=checkbox]), .pop .fields textarea { width: 100%; min-width: 0; height: 40px; border: 2px solid var(--field); border-radius: 14px; padding: 0 12px; background: var(--tile); font-weight: 600; }
.pop .fields textarea { height: 72px; min-height: 72px; max-height: 220px; padding: 8px 12px; resize: none; line-height: 1.4; }
.pop .fields input:focus, .pop .fields textarea:focus { outline: none; border-color: var(--leaf); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@container pop (max-width: 400px) { .two { grid-template-columns: 1fr; } }
.gseg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--mint-2); border-radius: 16px; padding: 4px; }
@container pop (max-width: 330px) { .gseg { grid-template-columns: repeat(2, 1fr); } }
.gseg label { display: block; }
.gseg input { position: absolute; opacity: 0; pointer-events: none; }
.gseg span { display: grid; place-items: center; height: 34px; border-radius: 12px; font-weight: 700; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.gseg input:checked + span { background: var(--tile); color: var(--ink); box-shadow: 0 2px 0 var(--ledge); }
.gseg input:focus-visible + span { outline: 3px solid var(--leaf); }
.pop .help, .help { margin: -2px 0 0; font-size: 12px; color: var(--ink-3); font-weight: 500; }
.check { display: flex !important; flex-direction: row; align-items: center; gap: 8px; }
.check input { width: 18px; height: 18px; accent-color: var(--leaf); }
/* "This is me" switch at the top of the edit form */
.pop .me-toggle { position: relative; grid-template-columns: auto 1fr; align-items: center; gap: 12px; padding: 10px 14px 10px 12px; border-radius: 18px; background: var(--mint-2); cursor: pointer; }
.me-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.me-toggle .knob { width: 38px; height: 22px; border-radius: 99px; background: var(--field); position: relative; transition: background .2s; }
.me-toggle .knob::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--tile); transition: transform .2s cubic-bezier(.3, 1.4, .5, 1); }
.me-toggle input:checked + .knob { background: var(--leaf); }
.me-toggle input:checked + .knob::after { transform: translateX(16px); }
.me-toggle input:focus-visible + .knob { outline: 3px solid var(--leaf); outline-offset: 2px; }
.me-toggle b { display: block; font-size: 14.5px; color: var(--ink); }
.me-toggle small { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); }

/* ---------- about and "who are you" sheets ---------- */
.lede { margin: -4px 0 16px; font-size: 15.5px; line-height: 1.55; color: var(--ink-2); max-width: 62ch; }
.about-hero { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 14px; margin: 0 48px 10px 0; }
.about-hero .wm { font-size: clamp(40px, 7vw, 58px); padding-bottom: 4px; }
.about-hero .sub { font-size: 22px; font-weight: 600; }
.about-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 10px; }
.about-grid .span2 { grid-column: 2; grid-row: 1 / span 2; }
.about-card { background: var(--mint-2); border-radius: 22px; padding: 16px 18px; }
.about-card h3 { margin: 0 0 10px; font: 800 16px var(--display); letter-spacing: -.01em; }
.about-card p { margin: 0; color: var(--ink-2); font-size: 14px; }
.keys { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.keys li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; font-size: 13.5px; font-weight: 500; color: var(--ink-2); line-height: 1.35; }
.keys li b { display: block; color: var(--ink); font-weight: 700; font-size: 14px; }
.keys .mk { width: 36px; height: 36px; border-radius: 50%; background: var(--card); display: grid; place-items: center; color: color-mix(in srgb, var(--side-ink) 80%, var(--ink-3)); }
.keys .mk svg { width: 70%; height: 70%; }
.sw-you { width: 36px; height: 30px; border-radius: 11px; background: var(--leaf); box-shadow: 0 3px 0 var(--ledge-leaf); }
.sw-sides { display: flex; gap: 3px; justify-content: center; }
.sw-sides i { width: 10px; height: 10px; border-radius: 50%; background: var(--side); }
.sw-dash { height: 3px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--ink-3) 0 3px, transparent 3px 9px); }
.kbd { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; margin: 0; font-size: 13.5px; }
.kbd dt { display: flex; gap: 4px; }
.kbd dd { margin: 0; align-self: center; color: var(--ink-2); font-weight: 600; }
kbd { min-width: 26px; height: 26px; padding: 0 7px; border-radius: 9px; display: inline-grid; place-items: center; background: var(--tile); color: var(--ink); font: 700 12.5px var(--ui); box-shadow: 0 2px 0 var(--ledge); }
.about-foot { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.me-now { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px; border-radius: 22px; background: var(--mint-2); }
.me-now .q { width: 54px; height: 54px; border-radius: 50%; background: var(--mint); color: var(--leaf-deep); display: grid; place-items: center; font-size: 22px; }
.me-now .who { flex: 1; min-width: 180px; }
.me-now .who b { display: block; font: 700 18px var(--display); }
.me-now .who span { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.me-now .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.face.is-me { background: var(--mint); color: var(--leaf-deep); }

.toast { position: fixed; z-index: 40; left: 50%; top: 84px; transform: translate(-50%, -10px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 14px; transition: .25s cubic-bezier(.3, 1.4, .5, 1); pointer-events: none; display: flex; gap: 8px; align-items: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast button { pointer-events: auto; border: 0; background: var(--leaf); color: var(--on-leaf); border-radius: 99px; padding: 3px 10px; font-weight: 700; }

@media (max-width: 1300px) { .tabs button span, .dock button > span:not(.av) { display: none; } .tabs button, .dock button { padding: 0 14px; } .dock .me { padding: 0 8px; } }
@media (max-width: 760px) {
  .brand { padding: 8px 12px; gap: 4px; }
  .brand .sub, .legend, .ttl-sub, .ttl-stats { display: none; }
  .brand .wm { font-size: 16px; }
  .titleblock { padding-top: 4px; }
  /* leave room for the buttons at the top right; long titles wrap to two lines */
  .brand { max-width: calc(100vw - 168px); }
  .brand.editing { max-width: calc(100vw - 32px); }
  .ttl { max-width: 100%; }
  .ttl-text { font-size: 16.5px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tabs { top: var(--tabs-top, 90px); }
  .corner .zoomset, .corner .undoset { display: none; }
  .panelview { left: 8px; right: 8px; }
  .slots { grid-template-columns: 1fr; }
  .swap { justify-self: center; rotate: 90deg; }
  .exports, .about-grid { grid-template-columns: 1fr; }
  .about-grid .span2 { grid-column: auto; grid-row: auto; }
}
/* phones and short windows: the person card becomes a bottom sheet over the dock */
@media (max-width: 760px), (max-height: 540px) {
  .pop { left: 8px !important; right: 8px; top: auto !important; bottom: calc(8px + env(safe-area-inset-bottom)); width: auto; max-height: calc(100dvh - 56px) !important; border-radius: 26px 26px 22px 22px; }
  .pop::before { content: ''; flex: none; width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 8px auto -6px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; } }
@media print {
  .dock, .corner, .tabs, .sheet, .pop, .toast, .sprout, .fold, .brand { display: none !important; }
  .printhead { display: block; position: fixed; top: 20px; left: 0; right: 0; text-align: center; }
  .printhead b { display: block; font: 800 34px/1.1 var(--display); letter-spacing: -.02em; }
  .printhead span { display: block; margin-top: 4px; font-weight: 600; color: var(--ink-2); }
  .printhead small { display: block; margin-top: 2px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .printfoot { display: block; position: fixed; right: 24px; bottom: 14px; font-size: 11px; font-weight: 600; color: var(--ink-3); }
  .printfoot .wm { font-size: 13px; }
}
</style>

  // Relationship engine
  // ---------------------------------------------------------------------------
  const W = {
    parent: { m: 'father', f: 'mother', n: 'parent' },
    child: { m: 'son', f: 'daughter', n: 'child' },
    sibling: { m: 'brother', f: 'sister', n: 'sibling' },
    half: { m: 'half brother', f: 'half sister', n: 'half sibling' },
    grandparent: { m: 'grandfather', f: 'grandmother', n: 'grandparent' },
    grandchild: { m: 'grandson', f: 'granddaughter', n: 'grandchild' },
    aunt: { m: 'uncle', f: 'aunt', n: "parent's sibling" },
    niece: { m: 'nephew', f: 'niece', n: "sibling's child" },
    spouse: { m: 'husband', f: 'wife', n: 'spouse' },
    partner: { m: 'partner', f: 'partner', n: 'partner' },
    ex: { m: 'former husband', f: 'former wife', n: 'former partner' },
    parentInLaw: { m: 'father-in-law', f: 'mother-in-law', n: 'parent-in-law' },
    childInLaw: { m: 'son-in-law', f: 'daughter-in-law', n: 'child-in-law' },
    siblingInLaw: { m: 'brother-in-law', f: 'sister-in-law', n: 'sibling-in-law' },
    stepParent: { m: 'stepfather', f: 'stepmother', n: 'stepparent' },
    stepChild: { m: 'stepson', f: 'stepdaughter', n: 'stepchild' },
    auntByMarriage: { m: 'uncle by marriage', f: 'aunt by marriage', n: 'aunt or uncle by marriage' },
  };
  // gender: 'm' male, 'f' female, 'u' unknown, 'o' other (with optional genderOther text).
  // Unknown and other use neutral words.
  const g = p => (p.gender === 'm' ? 'm' : p.gender === 'f' ? 'f' : 'n');
  const GENDERS = { m: 'Male', f: 'Female', u: 'Unknown', o: 'Other' };
  const genderLabel = p => (p.gender === 'o' ? (p.genderOther || 'Other') : GENDERS[p.gender] || 'Unknown');
  const word = (key, p) => W[key][g(p)];
  const greats = n => (n <= 0 ? '' : 'great-'.repeat(n));
  const ORD = ['zeroth', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth'];
  const TIMES = ['', 'once', 'twice', 'three times', 'four times', 'five times'];

  function ancestors(id) {
    const out = new Map([[id, 0]]);
    const q = [id];
    while (q.length) {
      const cur = q.shift();
      parentsOf(cur).forEach(par => { if (!out.has(par)) { out.set(par, out.get(cur) + 1); q.push(par); } });
    }
    return out;
  }

  function partnerWord(a, b) {
    const f = partnerFamilyBetween(a, b);
    const bp = byId[b];
    if (!f) return null;
    if (f.status === 'divorced' || f.status === 'separated') return word('ex', bp);
    if (f.status === 'partners') return word('partner', bp);
    return word('spouse', bp);
  }

  // "B is A's ___" using blood only. Returns {key, label} or null.
  function blood(a, b) {
    if (a === b) return null;
    const A = ancestors(a), B = ancestors(b);
    let best = null;
    A.forEach((da, id) => {
      if (B.has(id)) {
        const db = B.get(id), s = da + db;
        if (!best || s < best.s) best = { id, da, db, s };
      }
    });
    if (!best) return null;
    const { da, db } = best;
    const bp = byId[b];
    if (db === 0) {
      if (da === 1) return { key: 'parent', label: word('parent', bp) };
      return { key: 'grandparent', label: greats(da - 2) + word('grandparent', bp) };
    }
    if (da === 0) {
      if (db === 1) return { key: 'child', label: word('child', bp) };
      return { key: 'grandchild', label: greats(db - 2) + word('grandchild', bp) };
    }
    if (da === 1 && db === 1) {
      const full = birthFam[a] && birthFam[a] === birthFam[b];
      return { key: 'sibling', label: word(full ? 'sibling' : 'half', bp) };
    }
    if (da === 1) {
      const n = db - 2;
      if (n === 0) return { key: 'niece', label: word('niece', bp) };
      return { key: 'niece', label: g(bp) === 'n' ? `sibling's ${greats(n - 1)}grandchild` : greats(n - 1) + 'grand' + word('niece', bp) };
    }
    if (db === 1) {
      const n = da - 2;
      if (n === 0) return { key: 'aunt', label: word('aunt', bp) };
      return { key: 'aunt', label: g(bp) === 'n' ? `${greats(n - 1)}grandparent's sibling` : greats(n) + word('aunt', bp) };
    }
    const deg = Math.min(da, db) - 1, rem = Math.abs(da - db);
    return { key: 'cousin', label: `${ORD[deg] || deg + 'th'} cousin${rem ? ' ' + (TIMES[rem] || rem + ' times') + ' removed' : ''}` };
  }

  // Full relationship: blood first, then one marriage hop, then a sentence built from the path.
  function relation(a, b) {
    if (a === b) return { label: 'you', blood: true };
    const pw = partnerWord(a, b);
    if (pw) return { label: pw, blood: false, kind: 'partner' };
    const r = blood(a, b);
    if (r) return { label: r.label, blood: true, key: r.key };
    // b is the partner of one of a's blood relatives
    for (const q of partnersOf(b)) {
      const rq = blood(a, q);
      if (!rq) continue;
      const f = partnerFamilyBetween(q, b);
      const ex = f && (f.status === 'divorced' || f.status === 'separated');
      const bp = byId[b];
      if (ex) return { label: `${rq.label}'s ${word('ex', bp)}`, blood: false };
      if (rq.key === 'sibling') return { label: word('siblingInLaw', bp), blood: false };
      if (rq.key === 'child') return { label: word('childInLaw', bp), blood: false };
      if (rq.key === 'parent') return { label: word('stepParent', bp), blood: false };
      if (rq.key === 'aunt' && rq.label.indexOf('great') === -1) return { label: word('auntByMarriage', bp), blood: false };
      return { label: `${rq.label}'s ${word('spouse', bp)}`, blood: false };
    }
    // b is a blood relative of one of a's partners
    for (const q of partnersOf(a)) {
      const rq = blood(q, b);
      if (!rq) continue;
      const bp = byId[b];
      if (rq.key === 'parent') return { label: word('parentInLaw', bp), blood: false };
      if (rq.key === 'sibling') return { label: word('siblingInLaw', bp), blood: false };
      if (rq.key === 'child') return { label: word('stepChild', bp), blood: false };
      return { label: `${partnerWord(a, q)}'s ${rq.label}`, blood: false };
    }
    // partner's sibling's partner (co-sibling-in-law)
    for (const q of partnersOf(a)) for (const r of partnersOf(b)) {
      const rq = blood(q, r);
      if (rq && rq.key === 'sibling') return { label: word('siblingInLaw', byId[b]), blood: false };
    }
    return { label: 'related by marriage', blood: false, kind: 'marriage' };
  }

  // Sentence for UI: "Anika is your first cousin"
  function sentence(a, b) {
    const r = relation(a, b), bp = byId[b], ap = byId[a];
    if (a === b) return a === state.homeId ? 'This is you' : `This is ${ap.first}`;
    if (r.kind === 'marriage') {
      const bridge = marriageBridge(a, b);
      return bridge || `${bp.first} and ${ap.first} are related by marriage`;
    }
    const whose = a === state.homeId ? 'your' : `${ap.first}'s`;
    return `${bp.first} is ${whose} ${r.label}`;
  }

  // "Iris's uncle Daniel is married to Anika's aunt Priya"
  function marriageBridge(a, b) {
    const pth = path(a, b);
    if (!pth) return null;
    const ps = pth.persons;
    for (let i = 0; i < ps.length - 1; i++) {
      const x = ps[i], y = ps[i + 1];
      if (partnerFamilyBetween(x, y)) {
        const rx = x === a ? null : blood(a, x), ry = y === b ? null : blood(b, y);
        const ap = byId[a], bp = byId[b];
        const left = x === a ? ap.first : `${ap.first}'s ${rx ? rx.label : 'relative'} ${byId[x].first}`;
        const right = y === b ? bp.first : `${bp.first}'s ${ry ? ry.label : 'relative'} ${byId[y].first}`;
        const f = partnerFamilyBetween(x, y);
        const verb = f.status === 'divorced' ? 'was married to' : 'is married to';
        return `${left} ${verb} ${right}`;
      }
    }
    return null;
  }

  // ---------------------------------------------------------------------------
  // Path finding over a person / family graph (Dijkstra, blood links preferred)
  // ---------------------------------------------------------------------------
  function neighbors(node) {
    const [t, id] = [node[0], node.slice(2)];
    const out = [];
    if (t === 'p') {
      if (birthFam[id]) out.push(['f:' + birthFam[id], 0.5]);
      partnerFams[id].forEach(fid => out.push(['f:' + fid, 0.6]));
    } else {
      const f = famById[id];
      f.partners.forEach(pid => out.push(['p:' + pid, 0.6]));
      f.children.forEach(c => out.push(['p:' + c.id, 0.5]));
    }
    return out;
  }
  function path(a, b) {
    const start = 'p:' + a, goal = 'p:' + b;
    const dist = new Map([[start, 0]]), prev = new Map(), done = new Set();
    while (true) {
      let cur = null, cd = Infinity;
      dist.forEach((d, n) => { if (!done.has(n) && d < cd) { cd = d; cur = n; } });
      if (!cur) return null;
      if (cur === goal) break;
      done.add(cur);
      neighbors(cur).forEach(([n, w]) => {
        const nd = cd + w;
        if (!dist.has(n) || nd < dist.get(n) - 1e-9) { dist.set(n, nd); prev.set(n, cur); }
      });
    }
    const nodes = [goal];
    while (nodes[0] !== start) nodes.unshift(prev.get(nodes[0]));
    const persons = nodes.filter(n => n[0] === 'p').map(n => n.slice(2));
    const fams = nodes.filter(n => n[0] === 'f').map(n => n.slice(2));
    const edges = [];
    for (let i = 0; i < nodes.length - 1; i++) {
      const x = nodes[i], y = nodes[i + 1];
      const [pn, fn] = x[0] === 'p' ? [x, y] : [y, x];
      edges.push(edgeKey(fn.slice(2), pn.slice(2)));
    }
    return { nodes, persons, families: fams, edges };
  }
  // Edge keys: c:<fam>:<child> is the drop from the family point to a child,
  // h:<fam>:<partner> is the half of the partner line from that partner to the family point.
  function edgeKey(fid, pid) {
    const f = famById[fid];
    return f.partners.includes(pid) ? `h:${fid}:${pid}` : `c:${fid}:${pid}`;
  }

  // Hop chain: "Maya, her mother Priya, Priya's brother Arjun, his daughter Anika"
  function chain(a, b) {
    const pth = path(a, b);
    if (!pth) return [];
    const ps = pth.persons;
    return ps.map((id, i) => {
      if (i === 0) return { id, rel: null };
      const prev = ps[i - 1];
      let rel = partnerWord(prev, id);
      if (!rel) { const r = blood(prev, id); rel = r ? r.label : 'relative'; }
      return { id, rel };
    });
  }

  function immediate(id) {
    const persons = new Set([id]), edges = new Set();
    const bf = birthFam[id];
    if (bf) {
      edges.add(`c:${bf}:${id}`);
      famById[bf].partners.forEach(pid => { persons.add(pid); edges.add(`h:${bf}:${pid}`); });
    }
    partnerFams[id].forEach(fid => {
      const f = famById[fid];
      f.partners.forEach(pid => { persons.add(pid); edges.add(`h:${fid}:${pid}`); });
      f.children.forEach(c => { persons.add(c.id); edges.add(`c:${fid}:${c.id}`); });
    });
    return { persons, edges };
  }

  // ---------------------------------------------------------------------------
  // Branch sides relative to the home person
  // 'own' = you, your siblings, partner and descendants; 'paternal' / 'maternal' = your father's /
  // mother's side (in-laws take their partner's side); null = not connected by blood or marriage.
  // ---------------------------------------------------------------------------
  function homeParents() {
    if (!state.homeId) return { father: null, mother: null };
    const ps = parentsOf(state.homeId).map(id => byId[id]);
    let father = ps.find(p => p.gender === 'm'), mother = ps.find(p => p.gender === 'f');
    if (!father) father = ps.find(p => p !== mother);
    if (!mother) mother = ps.find(p => p !== father);
    return { father: father ? father.id : null, mother: mother ? mother.id : null };
  }
  function bloodSide(id) {
    const { father, mother } = homeParents();
    const A = ancestors(id);
    if (id === state.homeId || (father && mother && A.has(father) && A.has(mother))) return 'own';
    if (A.has(state.homeId)) return 'own';
    const P = father ? ancestors(father) : new Map(), M = mother ? ancestors(mother) : new Map();
    for (const k of A.keys()) if (P.has(k)) return 'paternal';
    for (const k of A.keys()) if (M.has(k)) return 'maternal';
    return null;
  }
  // Neutral view (no home person): shade by founding line instead. A founding couple is a pair with
  // no recorded parents who have children, where neither partner married into another line. The two
  // largest lines take the 'paternal' and 'maternal' shades, and people descended from both take 'own'.
  function lines() {
    return memo('lines', () => {
      const out = [], seen = new Set();
      people.forEach(p => {
        if (seen.has(p.id) || birthFam[p.id] || !childrenOf(p.id).length) return;
        const ps = partnersOf(p.id);
        if (ps.some(q => birthFam[q])) return;
        const roots = [p.id, ...ps.filter(q => !birthFam[q])];
        roots.forEach(r => seen.add(r));
        const desc = new Set(), q = [...roots];
        while (q.length) childrenOf(q.shift()).forEach(k => { if (!desc.has(k)) { desc.add(k); q.push(k); } });
        const count = {};
        [...roots, ...desc].forEach(id => { const x = byId[id], n = x.birthSurname || x.last; if (n) count[n] = (count[n] || 0) + 1; });
        const surname = Object.keys(count).sort((a, b) => count[b] - count[a])[0] || byId[p.id].first;
        out.push({ roots, size: desc.size, surname });
      });
      return out.sort((a, b) => b.size - a.size);
    });
  }
  function lineSide(id) {
    const A = ancestors(id);
    const hits = lines().map((ln, i) => (ln.roots.some(r => A.has(r)) ? i : -1)).filter(i => i >= 0);
    if (!hits.length) return null;
    if (hits.includes(0) && hits.includes(1)) return 'own';
    return hits[0] === 0 ? 'paternal' : hits[0] === 1 ? 'maternal' : 'other';
  }
  const bloodSideAny = id => (state.homeId ? bloodSide(id) : lineSide(id));
  function sideInfo(id) {
    const b = bloodSideAny(id);
    if (b) return { side: b, blood: true };
    for (const q of partnersOf(id)) { const s2 = bloodSideAny(q); if (s2) return { side: s2, blood: false }; }
    return { side: null, blood: false };
  }
  const side = id => sideInfo(id).side;
  function sideNames() {
    if (!state.homeId) {
      const ls = lines();
      return { paternal: ls[0] ? `${ls[0].surname} line` : 'First line', maternal: ls[1] ? `${ls[1].surname} line` : 'Second line', own: 'Both lines', other: 'Other lines' };
    }
    const { father, mother } = homeParents();
    const f = father && byId[father], m = mother && byId[mother];
    return {
      paternal: f ? `${f.last || f.first} side` : "Father's side",
      maternal: m ? `${m.birthSurname || m.last || m.first} side` : "Mother's side",
      own: 'Your family',
    };
  }
  // generation number for everyone (0 = oldest), ignoring collapsed branches
  function generations() {
    const gen = {};
    people.forEach(p => { gen[p.id] = 0; });
    for (let it = 0; it < 40; it++) {
      let changed = false;
      people.forEach(p => {
        const ps = parentsOf(p.id);
        if (ps.length) { const want = Math.max(...ps.map(x => gen[x])) + 1; if (gen[p.id] < want) { gen[p.id] = want; changed = true; } }
      });
      families.forEach(f => {
        if (f.partners.length > 1) { const m = Math.max(...f.partners.map(x => gen[x])); f.partners.forEach(x => { if (gen[x] < m) { gen[x] = m; changed = true; } }); }
      });
      people.forEach(p => {
        if (parentsOf(p.id).length) return;
        const kids = childrenOf(p.id);
        if (kids.length) { const want = Math.max(...kids.map(k => gen[k])) - 1; if (gen[p.id] < want) { gen[p.id] = want; changed = true; } }
      });
      if (!changed) break;
    }
    const min = Math.min(...Object.values(gen));
    Object.keys(gen).forEach(k => { gen[k] -= min; });
    return gen;
  }

  // ---------------------------------------------------------------------------
  // Collapse (hide branches)
  // ---------------------------------------------------------------------------
  const collapse = { fams: new Set(), anc: new Set() };
  // Collapse needs a point to measure "hidden" from. That's you, or in the neutral view the person
  // with the most recorded ancestors (where the most lines meet).
  function anchorId() {
    if (state.homeId) return state.homeId;
    return memo('anchor', () => people.reduce((best, p) => {
      const n = ancestors(p.id).size, bn = best ? ancestors(best.id).size : -1;
      return n > bn || (n === bn && (p.birth.y || 0) > (best.birth.y || 0)) ? p : best;
    }, null).id);
  }
  function homeLine() {
    const persons = new Set(ancestors(anchorId()).keys());
    const fams = new Set();
    persons.forEach(id => { if (birthFam[id]) fams.add(birthFam[id]); });
    return { persons, fams };
  }
  function canCollapseFamily(fid) { return famById[fid].children.length > 0 && !homeLine().fams.has(fid); }
  function canCollapseAncestors(pid) { return !!birthFam[pid] && homeLine().persons.has(pid); }
  function visibleSets() {
    const cut = new Set();
    collapse.fams.forEach(fid => famById[fid].children.forEach(c => cut.add(`c:${fid}:${c.id}`)));
    collapse.anc.forEach(pid => { if (birthFam[pid]) cut.add(`c:${birthFam[pid]}:${pid}`); });
    const start = 'p:' + anchorId(), seen = new Set([start]), q = [start];
    while (q.length) {
      const cur = q.shift();
      neighbors(cur).forEach(([n]) => {
        const [pn, fn] = cur[0] === 'p' ? [cur, n] : [n, cur];
        if (cut.has(edgeKey(fn.slice(2), pn.slice(2)))) return;
        if (!seen.has(n)) { seen.add(n); q.push(n); }
      });
    }
    const persons = new Set([...seen].filter(n => n[0] === 'p').map(n => n.slice(2)));
    const fams = new Set([...seen].filter(n => n[0] === 'f').map(n => n.slice(2)));
    return { persons, fams };
  }
  function hiddenBy(kind, id) {
    // people that would come back if this collapse was undone
    const before = visibleSets().persons;
    const set = kind === 'fam' ? collapse.fams : collapse.anc;
    const had = set.has(id);
    set.delete(id);
    const after = visibleSets().persons;
    if (had) set.add(id);
    return [...after].filter(x => !before.has(x));
  }
  function toggleFamily(fid) { collapse.fams.has(fid) ? collapse.fams.delete(fid) : collapse.fams.add(fid); emit(); }
  function toggleAncestors(pid) { collapse.anc.has(pid) ? collapse.anc.delete(pid) : collapse.anc.add(pid); emit(); }
  function expandAll() { collapse.fams.clear(); collapse.anc.clear(); emit(); }
  // Expand whatever hides a person (used by search)
  function reveal(id) {
    let changed = false;
    for (let guard = 0; guard < 20 && !visibleSets().persons.has(id); guard++) {
      const fam = [...collapse.fams].find(f => hiddenBy('fam', f).includes(id));
      const anc = [...collapse.anc].find(p => hiddenBy('anc', p).includes(id));
      if (fam) collapse.fams.delete(fam); else if (anc) collapse.anc.delete(anc); else { collapse.fams.clear(); collapse.anc.clear(); }
      changed = true;
    }
    if (changed) emit();
    return changed;
  }

  // ---------------------------------------------------------------------------
  // Layout: household blocks, generation rows, barycenter ordering, least squares placement
  // ---------------------------------------------------------------------------
  function layout(opts = {}) {
    const o = Object.assign({ nodeW: 188, nodeH: 64, partnerGap: 36, blockGap: 36, familyGap: 64, rowGap: 96, dir: 'down' }, opts);
    const vis = visibleSets();
    const V = vis.persons;
    const nodeU = o.dir === 'down' ? o.nodeW : o.nodeH;
    const nodeV = o.dir === 'down' ? o.nodeH : o.nodeW;
    const visParentsFam = id => (birthFam[id] && vis.fams.has(birthFam[id]) && V.has(id) && !collapse.anc.has(id) ? birthFam[id] : null);
    const visFams = families.filter(f => vis.fams.has(f.id));
    const visPartners = f => f.partners.filter(p => V.has(p));
    const visChildren = f => (collapse.fams.has(f.id) ? [] : f.children.map(c => c.id).filter(c => V.has(c) && visParentsFam(c) === f.id));

    // generations
    const gen = {};
    V.forEach(id => { gen[id] = 0; });
    for (let it = 0; it < 40; it++) {
      let changed = false;
      V.forEach(id => {
        const pf = visParentsFam(id);
        if (pf) {
          const want = Math.max(...visPartners(famById[pf]).map(p => gen[p])) + 1;
          if (gen[id] < want) { gen[id] = want; changed = true; }
        }
      });
      visFams.forEach(f => {
        const ps = visPartners(f);
        if (ps.length > 1) { const m = Math.max(...ps.map(p => gen[p])); ps.forEach(p => { if (gen[p] < m) { gen[p] = m; changed = true; } }); }
      });
      V.forEach(id => {
        if (visParentsFam(id)) return;
        const kids = partnerFams[id].flatMap(fid => (vis.fams.has(fid) ? visChildren(famById[fid]) : []));
        if (kids.length) {
          const want = Math.max(...kids.map(k => gen[k])) - 1;
          if (gen[id] < want) { gen[id] = want; changed = true; }
        }
      });
      if (!changed) break;
    }
    const minGen = Math.min(...[...V].map(id => gen[id]));
    V.forEach(id => { gen[id] -= minGen; });

    // household blocks (connected partners)
    const blockOf = {}, blocks = [];
    V.forEach(id => {
      if (blockOf[id]) return;
      const members = [], q = [id];
      const seen = new Set([id]);
      while (q.length) {
        const cur = q.shift(); members.push(cur);
        partnerFams[cur].forEach(fid => {
          if (!vis.fams.has(fid)) return;
          famById[fid].partners.forEach(p => { if (V.has(p) && !seen.has(p)) { seen.add(p); q.push(p); } });
        });
      }
      // chain order: someone with one partner first
      if (members.length > 2) {
        const deg = m => partnersOf(m).filter(x => members.includes(x)).length;
        const startM = members.find(m => deg(m) === 1) || members[0];
        const ordered = [startM];
        while (ordered.length < members.length) {
          const last = ordered[ordered.length - 1];
          const nxt = partnersOf(last).find(x => members.includes(x) && !ordered.includes(x));
          if (!nxt) break; ordered.push(nxt);
        }
        members.splice(0, members.length, ...ordered, ...members.filter(m => !ordered.includes(m)));
      } else {
        members.sort((x, y) => people.indexOf(byId[x]) - people.indexOf(byId[y]));
      }

  const GEN_NAMES = { 3: 'Great-grandparents', 2: 'Grandparents', 1: 'Parents', 0: 'Your generation', '-1': 'Children', '-2': 'Grandchildren' };

  const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

      const extra = norm([p.birth && p.birth.place, p.birth && p.birth.y, p.death && p.death.y].join(' '));

      if (first.startsWith(q) || name.startsWith(q)) s = 100;
      else if (last.startsWith(q) || maiden.startsWith(q) || nick.startsWith(q)) s = 80;
      else if (name.includes(q)) s = 60;

  // ---------------------------------------------------------------------------
  // Editing

  const undoStack = [], redoStack = [];

  function restore(str) {
    const d = JSON.parse(str);
    ['homeId', 'title', 'subtitle', 'showStats'].forEach(k => { if (d[k] !== undefined) state[k] = d[k]; });

  // ---------------------------------------------------------------------------
  // Tree title
  // ---------------------------------------------------------------------------
  // "The Alvarez & Raman Family": the two largest founding lines, or the most common surname
  function suggestedTitle() {
    const ls = lines().slice(0, 2).map(l => l.surname);
    if (ls.length) return `The ${ls.join(' & ')} Family`;
    const count = {};
    people.forEach(p => { if (p.last) count[p.last] = (count[p.last] || 0) + 1; });
    const top = Object.keys(count).sort((a, b) => count[b] - count[a])[0];

  }
  const treeTitle = () => state.title || suggestedTitle();
  // "23 people · 5 generations · since 1911"
  function treeStats() {
    const n = people.length, gen = generations(), ys = people.map(p => p.birth && p.birth.y).filter(Boolean);
    const g = n ? Math.max(...Object.values(gen)) + 1 : 0;
    return [`${n} ${n === 1 ? 'person' : 'people'}`, g ? `${g} ${g === 1 ? 'generation' : 'generations'}` : '', ys.length ? `since ${Math.min(...ys)}` : ''].filter(Boolean).join(' · ');
  }
  function setTreeInfo(patch) { commit(); Object.assign(state, patch); emit(); }

  const titleSlug = () => norm(treeTitle()).replace(/^the\s+/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'family-tree';
  const calendarName = () => `${treeTitle().replace(/^the\s+/i, '').replace(/\s+family$/i, '')} birthdays`;

    const p = Object.assign({ id: 'new' + seq++, first: 'New', last: '', gender: 'u', birth: {} }, fields);

  }
  function addRelative(id, type) {
    const base = byId[id];

    commit();
    let p;
    if (type === 'parent') {
      let fid = birthFam[id];
      if (!fid) { fid = 'f_new' + seq++; families.push({ id: fid, partners: [], status: 'married', children: [{ id, kind: 'bio' }] }); }
      const f = families.find(x => x.id === fid);
      if (f.partners.length >= 2) return null;
      p = newPerson({ first: 'New parent', last: base.last });
      f.partners.push(p.id);
    } else if (type === 'partner') {
      p = newPerson({ first: 'New partner' });
      families.push({ id: 'f_new' + seq++, partners: [id, p.id], status: 'married', children: [] });
    } else if (type === 'child') {
      p = newPerson({ first: 'New child', last: base.last });
      let fid = partnerFams[id][partnerFams[id].length - 1];
      if (!fid) { fid = 'f_new' + seq++; families.push({ id: fid, partners: [id], status: 'married', children: [] }); }
      families.find(x => x.id === fid).children.push({ id: p.id, kind: 'bio' });
    } else if (type === 'sibling') {
      let fid = birthFam[id];
      if (!fid) { fid = 'f_new' + seq++; families.push({ id: fid, partners: [], status: 'married', children: [{ id, kind: 'bio' }] }); }
      p = newPerson({ first: 'New sibling', last: base.last });

  }

    families.forEach(f => { f.partners = f.partners.filter(x => x !== id); f.children = f.children.filter(c => c.id !== id); });

  function readPhoto(file, size = 256) {

        const s = Math.min(img.width, img.height);

  // ---------------------------------------------------------------------------

    function cancel() { if (anim) cancelAnimationFrame(anim); anim = null; }
    function target(b, pad = 80, maxK = 1.1) {
      const r = el.getBoundingClientRect();
      const insets = typeof pad === 'number' ? { l: pad, r: pad, t: pad, b: pad } : pad;
      const aw = r.width - insets.l - insets.r, ah = r.height - insets.t - insets.b;
      const k = clampK(Math.min(aw / Math.max(b.w, 1), ah / Math.max(b.h, 1), maxK));
      return { k, x: insets.l + (aw - b.w * k) / 2 - b.x * k, y: insets.t + (ah - b.h * k) / 2 - b.y * k };
    }
    function flyTo(b, pad, maxK, ms = 650) {
      const to = target(b, pad, maxK);
      cancel();
      if (reduceMotion() || ms === 0) { Object.assign(t, to); apply(); return; }
      const from = { ...t }, t0 = performance.now();
      const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const tick = now => {
        const p = Math.min(1, (now - t0) / ms), e = ease(p);

  }

  function boundsOf(ids, L) {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    ids.forEach(id => { const n = L.nodes[id]; if (!n) return; x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h); });

  }

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  return {

    person, family, parentsOf, childrenOf, partnersOf, siblingsOf, birthFamilyOf: id => birthFam[id], familiesOf: id => partnerFams[id].slice(),
    fullName, initials, isLiving, photo, genderLabel, GENDERS, side, sideInfo, sideNames, lines, anchorId, setHome, generations, fmtDate, years, age, nextBirthday, upcomingBirthdays, isMilestone, inDays, today, MONTHS, MONTHS_LONG,
    relation, sentence, blood, path, chain, immediate, ancestors,
    collapse, toggleFamily, toggleAncestors, expandAll, reveal, hiddenBy, visibleSets, canCollapseFamily, canCollapseAncestors,
    layout, genName, boundsOf, search, update, addRelative, removePerson, readPhoto,
    suggestedTitle, treeTitle, treeStats, setTreeInfo, titleSlug, calendarName,
    undo, redo, canUndo: () => undoStack.length > 0, canRedo: () => redoStack.length > 0,

</script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const canvas = $('#treeView'), world = $('#world'), tilesEl = $('#tiles'), edgesEl = $('#edges'), sheet = $('#sheet'), pop = $('#pop'), tip = $('#tip');
  // The person marked "This is me". null is the neutral view, with no one at the center.
  const home = () => Vadi.state.homeId, NOW = Vadi.today().getFullYear();
  const qs = new URLSearchParams(location.search);
  if (qs.has('me')) Vadi.state.homeId = qs.get('me') === 'none' ? null : qs.get('me');
  const O = { nodeW: 140, nodeH: 180, partnerGap: 30, blockGap: 22, familyGap: 44, rowGap: 74 };
  let L, hover = null, pathState = null, openSheet = null, popId = null, popMode = 'view', first = true, naming = null, tab = 'tree';
  let focus = home() || Vadi.anchorId(), gens = 4, showDesc = true, fanHist = [focus];
  let year = null, playing = null;
  Vadi.state.app = { slug: 'jangal', name: 'Jangal' }; // export file names: alvarez-family-<date>.jangal.json
  const rel = { a: home(), b: null, picking: home() ? 'b' : 'a' };
