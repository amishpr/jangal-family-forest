<!doctype html>
<!-- The link preview image (PLAN 10.3), 1200 by 630. `npm run og` renders it with Playwright and
     writes public/og/jangal-og-<hash>.png. It uses the app's own colors and tile shapes. Nothing
     important sits near the edges, because some apps crop the card. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Source Sans 3';
        src: url('../node_modules/@fontsource-variable/source-sans-3/files/source-sans-3-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Figtree';
        src: url('../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2') format('woff2');
        font-weight: 300 900;
      }
      :root {
        --bg: #eff7f1;
        --card: #fdfffd;
        --ink: #0b3320;
        --ink-2: #3e6550;
        --ink-3: #50725e;
        --leaf: #17844a;
        --on-leaf: #f4fff8;
        --ledge: #cbe6d4;
        --ledge-leaf: #0e5c35;
        --mat: #6a962c;
        --mat-ink: #4b6d1c;
        --line: #bfddc9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Figtree', sans-serif;
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 74px;
        width: 520px;
      }
      .wm {
        font-size: 66px;
        line-height: 1;
        color: var(--ink);
      }
      .wm svg {
        fill: currentColor;
        overflow: visible;
      }
      .sub {
        margin-top: 10px;
        font: 600 30px 'Source Sans 3', sans-serif;
        color: var(--ink-3);
      }
      h1 {
        margin: 46px 0 0;
        font: 800 50px/1.06 'Source Sans 3', sans-serif;
        letter-spacing: -0.02em;
      }
      .fine {
        margin-top: 22px;
        font: 700 24px 'Figtree', sans-serif;
        color: var(--ink-2);
      }
      .tree {
        position: absolute;
        right: 64px;
        top: 70px;
        width: 500px;
        height: 490px;
      }
      .tile {
        position: absolute;
        width: 150px;
        height: 186px;
        padding: 16px 10px 0;
        border-radius: 26px;
        background: var(--card);
        text-align: center;
        box-shadow: 0 6px 0 var(--ledge), 0 0 0 5px var(--leaf), 0 6px 0 5px var(--ledge-leaf);
      }
      .tile.home {
        background: var(--leaf);
        color: var(--on-leaf);
      }
      .av {
        width: 72px;
        height: 72px;
        margin: 0 auto;
        border-radius: 50%;
        box-shadow: 0 0 0 4px var(--card), 0 0 0 8px color-mix(in srgb, var(--side) 62%, var(--card));
        overflow: hidden;
      }
      .home .av {
        box-shadow: 0 0 0 4px var(--on-leaf);
      }
      .av svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .nm {
        margin-top: 14px;
        font: 700 21px 'Source Sans 3', sans-serif;
        letter-spacing: -0.01em;
      }
      .tag {
        display: inline-block;
        margin-top: 8px;
        padding: 3px 12px;
        border-radius: 99px;
        font: 700 16px 'Figtree', sans-serif;
        background: color-mix(in srgb, var(--side) 13%, var(--card));
        color: var(--side-ink);
      }
      .home .tag {
        background: color-mix(in srgb, #0b3320 22%, var(--leaf));
        color: var(--on-leaf);
      }
      .s-pat {
        --side: #1e6a50;
        --side-ink: #185640;
      }
      .s-own {
        --side: #1b9a56;
        --side-ink: #117242;
      }
      .vine {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
      .chip {
        display: inline-block;
        margin-top: 26px;
        padding: 14px 24px;
        border-radius: 99px;
        background: var(--leaf);
        color: var(--on-leaf);
        font: 800 30px 'Source Sans 3', sans-serif;
        letter-spacing: -0.01em;
        box-shadow: 0 5px 0 var(--ledge-leaf);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="wm"><!--wordmark--></div>
      <div class="sub">- The Family Forest</div>
      <h1>See how everyone in your family is related</h1>
      <div class="chip">Kareena is your first cousin</div>
      <div class="fine">Free · Private · Made for big families</div>
    </div>

    <div class="tree">
      <svg class="vine" viewBox="0 0 500 490" aria-hidden="true">
        <!-- the path: Ranbir up to his father Rishi, across to Rishi's brother Randhir, down to his daughter Kareena -->
        <path d="M95 300 V272 Q95 263 104 263 H222 Q231 263 231 254 V226" fill="none" stroke="#17844a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M231 40 V29 Q231 20 240 20 H396 Q405 20 405 29 V40" fill="none" stroke="#17844a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M405 226 V300" fill="none" stroke="#17844a" stroke-width="9" stroke-linecap="round" />
      </svg>
      <div class="tile s-pat" style="left: 156px; top: 40px">
        <div class="av"><!--leaf:#1E6A50--></div>
        <div class="nm">Rishi</div>
        <div class="tag">Father</div>
      </div>
      <div class="tile s-pat" style="left: 330px; top: 40px">
        <div class="av"><!--leaf:#1E6A50--></div>
        <div class="nm">Randhir</div>
        <div class="tag">Uncle</div>
      </div>
      <div class="tile home s-own" style="left: 20px; top: 300px">
        <div class="av"><!--leaf:#1B9A56--></div>
        <div class="nm">Ranbir</div>
        <div class="tag">You</div>
      </div>
      <div class="tile s-pat" style="left: 330px; top: 300px">
        <div class="av"><!--leaf:#1E6A50--></div>
        <div class="nm">Kareena</div>
        <div class="tag">First cousin</div>
      </div>
    </div>
  </body>
</html>
